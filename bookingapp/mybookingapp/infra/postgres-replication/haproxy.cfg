global
    maxconn 200

defaults
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# -------- WRITE traffic (LEADER only) --------
frontend postgres_write
    bind *:5432
    default_backend postgres_leader

backend postgres_leader
    option httpchk GET /leader
    http-check expect status 200

    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008

# -------- READ traffic (REPLICAS) --------
frontend postgres_read
    bind *:5433
    default_backend postgres_replicas

backend postgres_replicas
    option httpchk GET /replica
    http-check expect status 200

    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
